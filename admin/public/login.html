<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestia Admin — Connexion</title>
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Gestia Admin</h1>
      <p class="sub">Gestion des sites vitrines clients</p>

      <div class="login-error" id="error"></div>

      <form id="login-form">
        <div>
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required autofocus autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary">Se connecter</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const err  = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('is-visible');
      const password = document.getElementById('password').value;
      try {
        const r = await fetch('/admin/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (r.ok) {
          location.href = '/admin/dashboard';
        } else {
          const j = await r.json().catch(() => ({}));
          err.textContent = j.error || 'Erreur de connexion';
          err.classList.add('is-visible');
        }
      } catch (e) {
        err.textContent = 'Impossible de joindre le serveur';
        err.classList.add('is-visible');
      }
    });
  </script>
</body>
</html>
